<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRDeltaPanel fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0d1117;
        color: #e6edf3;
      }

      main {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 24px;
      }

      #mount {
        width: min(1120px, 100%);
        min-height: 520px;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="mount"></div>
    </main>

    <script type="module">
      import { render } from "solid-js/web";
      import { PRDeltaPanel } from "/app/components/pr-delta-panel/PRDeltaPanel.tsx";
      import { makeEntityDelta, makePRDeltaSet } from "/app/lib/pr-delta.ts";

      const params = new URLSearchParams(window.location.search);

      window.__prDeltaPanelAddCommentEvents = [];
      window.__prDeltaPanelCreateThreadEvents = [];
      window.__prDeltaPanelEntityClickEvents = [];
      window.__prDeltaPanelSubmitVerdictEvents = [];
      window.__prDeltaPanelTransitionThreadEvents = [];
      window.__resetPRDeltaPanelEvents = () => {
        window.__prDeltaPanelAddCommentEvents.length = 0;
        window.__prDeltaPanelCreateThreadEvents.length = 0;
        window.__prDeltaPanelEntityClickEvents.length = 0;
        window.__prDeltaPanelSubmitVerdictEvents.length = 0;
        window.__prDeltaPanelTransitionThreadEvents.length = 0;
      };

      function numberParam(name, fallback) {
        const value = params.get(name);
        if (value === null || value.trim() === "") {
          return fallback;
        }

        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : fallback;
      }

      function boolParam(name, fallback) {
        const value = params.get(name);
        if (value === null) {
          return fallback;
        }
        return value !== "0" && value !== "false";
      }

      function stringParam(names, fallback) {
        for (const name of names) {
          const value = params.get(name);
          if (value !== null && value.trim() !== "") {
            return value;
          }
        }

        return fallback;
      }

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function thread(overrides) {
        const id = overrides.id;
        return {
          id,
          deltaSetId: `prdelta:fixture.${prNumber}`,
          anchorKind: "behavior",
          anchorId: "behavior:removed-0",
          anchorSide: "base",
          status: "open",
          comments: [
            {
              id: `${id.replace("review:", "comment:")}.1`,
              threadId: id,
              actor: "another-user",
              text: "Please verify the removal path.",
              createdAtMs: 1_700_000_000_000,
            },
          ],
          createdAtMs: 1_700_000_000_000,
          resolvedAtMs: null,
          resolvedBy: null,
          ...overrides,
        };
      }

      function trust() {
        return { state: "grounded", grounding: "lsp-type" };
      }

      function delta(partial) {
        return makeEntityDelta({
          deltaKind: "reshaped",
          entityKind: "behavior",
          baseId: "behavior:fixture",
          headId: "behavior:fixture",
          relatedIds: [],
          trust: trust(),
          attributionActor: "generator",
          ...partial,
        });
      }

      function repeat(count, build) {
        return Array.from({ length: Math.max(0, Math.trunc(count)) }, (_, index) =>
          build(index),
        );
      }

      const splitRelatedCount = Math.max(1, Math.trunc(numberParam("split_related_count", 2)));
      const mergedRelatedCount = Math.max(1, Math.trunc(numberParam("merged_related_count", 2)));

      const deltas = [
        ...repeat(numberParam("added", 0), (index) =>
          delta({
            deltaKind: "added",
            baseId: null,
            headId: `behavior:added-${index}`,
          }),
        ),
        ...repeat(numberParam("removed", 0), (index) =>
          delta({
            deltaKind: "removed",
            baseId: `behavior:removed-${index}`,
            headId: null,
          }),
        ),
        ...repeat(numberParam("renamed", 0), (index) =>
          delta({
            deltaKind: "renamed",
            baseId: `behavior:renamed-base-${index}`,
            headId: `behavior:renamed-head-${index}`,
          }),
        ),
        ...repeat(numberParam("reshaped", 0), (index) =>
          delta({
            deltaKind: "reshaped",
            baseId: `behavior:reshaped-${index}`,
            headId: `behavior:reshaped-${index}`,
          }),
        ),
        ...repeat(numberParam("unchanged", 0), (index) =>
          delta({
            deltaKind: "unchanged",
            baseId: `behavior:unchanged-${index}`,
            headId: `behavior:unchanged-${index}`,
          }),
        ),
        ...repeat(numberParam("split", 0), (index) =>
          delta({
            deltaKind: "split",
            baseId: `behavior:split-base-${index}`,
            headId: `behavior:split-head-${index}`,
            relatedIds: repeat(
              splitRelatedCount,
              (relatedIndex) => `behavior:split-head-${index}-related-${relatedIndex}`,
            ),
          }),
        ),
        ...repeat(numberParam("merged", 0), (index) =>
          delta({
            deltaKind: "merged",
            baseId: `behavior:merged-base-${index}`,
            headId: `behavior:merged-head-${index}`,
            relatedIds: repeat(
              mergedRelatedCount,
              (relatedIndex) => `behavior:merged-base-${index}-related-${relatedIndex}`,
            ),
          }),
        ),
        ...repeat(numberParam("unmatched_base", 0), (index) =>
          delta({
            deltaKind: "unmatched",
            baseId: `behavior:unmatched-base-${index}`,
            headId: null,
          }),
        ),
        ...repeat(numberParam("unmatched_head", 0), (index) =>
          delta({
            deltaKind: "unmatched",
            baseId: null,
            headId: `behavior:unmatched-head-${index}`,
          }),
        ),
      ];

      const prNumber = Math.trunc(numberParam("pr_number", numberParam("prNumber", 42)));
      const taskId = params.get("task_id") ?? params.get("taskId");
      const deltaSet = makePRDeltaSet({
        id: `prdelta:fixture.${prNumber}`,
        baseRevision: stringParam(["base_revision", "baseRevision"], "rev:fixture-base"),
        headRevision: stringParam(["head_revision", "headRevision"], "rev:fixture-head"),
        baseBranch: stringParam(["base_branch", "baseBranch"], "main"),
        headBranch: stringParam(["head_branch", "headBranch"], "feature/pr-delta"),
        prNumber: taskId === null ? prNumber : null,
        taskId,
        deltas,
        computedAtMs: 1_700_000_000_000,
        attributionActor: "generator",
      });

      const props = {
        deltaSet,
        threads: boolParam("threads", false)
          ? [
              thread({
                id: "review:fixture-open-1",
              }),
              thread({
                id: "review:fixture-open-2",
                comments: [
                  {
                    id: "comment:fixture-open-2.1",
                    threadId: "review:fixture-open-2",
                    actor: "you-this-session",
                    text: "The removed behavior still has callers.",
                    createdAtMs: 1_700_000_000_100,
                  },
                ],
              }),
              thread({
                id: "review:fixture-resolved-1",
                anchorId: "behavior:added-0",
                anchorSide: "head",
                status: "resolved",
                comments: [
                  {
                    id: "comment:fixture-resolved-1.1",
                    threadId: "review:fixture-resolved-1",
                    actor: "another-user",
                    text: "Resolved thread should not show as open.",
                    createdAtMs: 1_700_000_000_200,
                  },
                ],
                resolvedAtMs: 1_700_000_000_300,
                resolvedBy: "you-this-session",
              }),
            ]
          : [],
        verdict: params.has("verdict")
          ? {
              deltaSetId: `prdelta:fixture.${prNumber}`,
              decision: params.get("verdict"),
              decidedBy: "you-this-session",
              decidedAtMs: 1_700_000_000_500,
              rationale: "Fixture verdict rationale.",
            }
          : null,
        onEntityClick: (delta, side) => {
          window.__prDeltaPanelEntityClickEvents.push({
            delta: clone(delta),
            side,
          });
        },
        onCreateThread: (delta, side, initialComment) => {
          window.__prDeltaPanelCreateThreadEvents.push({
            delta: clone(delta),
            side,
            initialComment,
          });
        },
        onAddComment: (threadId, text) => {
          window.__prDeltaPanelAddCommentEvents.push({ threadId, text });
        },
        onTransitionThread: (threadId, toStatus) => {
          window.__prDeltaPanelTransitionThreadEvents.push({ threadId, toStatus });
        },
        onSubmitVerdict: (decision, rationale) => {
          window.__prDeltaPanelSubmitVerdictEvents.push({ decision, rationale });
        },
      };

      if (params.has("show_unchanged") || params.has("showUnchanged")) {
        props.showUnchanged = boolParam("show_unchanged", boolParam("showUnchanged", false));
      }

      render(() => PRDeltaPanel(props), document.getElementById("mount"));
    </script>
  </body>
</html>
