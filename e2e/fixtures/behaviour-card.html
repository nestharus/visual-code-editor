<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BehaviourCard fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0d1117;
        color: #e6edf3;
      }

      main {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 24px;
      }

      #mount {
        width: min(720px, 100%);
      }
    </style>
  </head>
  <body>
    <main>
      <div id="mount"></div>
    </main>

    <script type="module">
      import { createSignal } from "solid-js";
      import { render } from "solid-js/web";
      import { BehaviourCard } from "/app/components/behaviour-card/BehaviourCard.tsx";
      import { makeBehavior } from "/app/lib/behavior.ts";
      import { makeTrustSignal, trustStateFromString } from "/app/lib/trust.ts";

      const params = new URLSearchParams(window.location.search);
      const MODES = new Set(["view", "edit"]);

      window.__behaviourCardEvents = [];
      window.__resetBehaviourCardEvents = () => {
        window.__behaviourCardEvents.length = 0;
      };
      window.__behaviourCardGetSliceTextCalls = [];
      window.__resetBehaviourCardGetSliceTextCalls = () => {
        window.__behaviourCardGetSliceTextCalls.length = 0;
      };
      window.__behaviourCardWritebackRequests = [];

      function boolParam(name, fallback) {
        const value = params.get(name);
        if (value === null) {
          return fallback;
        }
        return value !== "false" && value !== "0";
      }

      function modeParam(name, fallback) {
        const value = params.get(name);
        return value !== null && MODES.has(value) ? value : fallback;
      }

      function numberParam(name, fallback) {
        const value = params.get(name);
        if (value === null || value.trim() === "") {
          return fallback;
        }

        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : fallback;
      }

      const sliceTemplates = [
        {
          filePath: "src/checkout/request.ts",
          startLine: 12,
          endLine: 28,
          startCol: null,
          endCol: null,
          sliceRole: "entry-point",
          discoveredBy: "agents:slice-constructor",
        },
        {
          filePath: "src/checkout/payment.ts",
          startLine: 41,
          endLine: 86,
          startCol: null,
          endCol: null,
          sliceRole: "body",
          discoveredBy: "agents:slice-constructor",
        },
        {
          filePath: "src/checkout/receipt.ts",
          startLine: 101,
          endLine: 132,
          startCol: null,
          endCol: null,
          sliceRole: "exit",
          discoveredBy: "agents:slice-constructor",
        },
        {
          filePath: "src/checkout/errors.ts",
          startLine: 17,
          endLine: 36,
          startCol: null,
          endCol: null,
          sliceRole: "error-path",
          discoveredBy: "agents:slice-constructor",
        },
      ];

      function buildSlices(sliceCount, confirmedCount) {
        return Array.from({ length: sliceCount }, (_, index) => {
          const template = sliceTemplates[index % sliceTemplates.length];
          const cycle = Math.floor(index / sliceTemplates.length);
          const lineOffset = cycle * 200;

          return {
            ...template,
            startLine: template.startLine + lineOffset,
            endLine: template.endLine + lineOffset,
            confirmedBy: index < confirmedCount ? "you-this-session" : null,
          };
        });
      }

      function buildBehavior() {
        const trustState = trustStateFromString(params.get("trustState") ?? "grounded");
        const sliceCount = Math.max(1, Math.trunc(numberParam("sliceCount", 3)));
        const confirmedCount = Math.max(
          0,
          Math.min(sliceCount, Math.trunc(numberParam("confirmedCount", 2))),
        );

        return makeBehavior({
          id: "behavior:checkout.lifecycle",
          label: "Checkout behavior",
          description: boolParam("withDescription", true)
            ? "Coordinates checkout request validation, payment authorization, and receipt emission."
            : null,
          sourceSlices: buildSlices(sliceCount, confirmedCount),
          trust: makeTrustSignal(trustState, trustState === "grounded" ? "test" : null),
          parentBehaviorId: null,
          attributionActor: "agents:slice-constructor",
        });
      }

      const [mode, setMode] = createSignal(modeParam("mode", "view"));
      const behaviour = buildBehavior();
      const parentRevision = params.get("parentRevision") ?? "rev:behaviour-card-fixture";

      window.__behaviourCardSliceTextByIndex = behaviour.sourceSlices.map((slice, index) => {
        return (
          params.get(`sliceText${index}`) ??
          [
            `// ${slice.filePath}`,
            `export const slice${index} = "line ${slice.startLine}";`,
            "",
          ].join("\n")
        );
      });

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function sliceIndex(slice) {
        return behaviour.sourceSlices.findIndex((candidate) => {
          return (
            candidate.filePath === slice.filePath &&
            candidate.startLine === slice.startLine &&
            candidate.endLine === slice.endLine
          );
        });
      }

      function getSliceText(slice) {
        const index = sliceIndex(slice);
        window.__behaviourCardGetSliceTextCalls.push({
          index,
          slice: clone(slice),
        });
        return Promise.resolve(window.__behaviourCardSliceTextByIndex[index] ?? "");
      }

      function parseWritebackBody(init) {
        if (typeof init?.body !== "string") {
          return {};
        }

        try {
          return JSON.parse(init.body);
        } catch {
          return {};
        }
      }

      function writebackResponseBody(kind, requestBody) {
        const draft = requestBody?.draft ?? {};
        const draftId = draft.id ?? "draft:fixture";
        const expectedRevision =
          draft.parent_revision ?? draft.parentRevision ?? parentRevision;

        if (kind === "success") {
          return {
            ok: true,
            plan: {
              draft,
              effective_diff: "--- fixture\n+++ fixture\n",
              applies_against_revision: expectedRevision,
              validated_at_ms: Date.now(),
            },
            applied_revision: "rev:fixture-applied",
            files_written: (draft.proposed_slices ?? draft.proposedSlices ?? []).map(
              (slice) => slice.file_path ?? slice.filePath,
            ),
            request_id: "request:fixture-success",
          };
        }

        if (kind === "conflict") {
          return {
            ok: false,
            conflict: {
              draft_id: draftId,
              conflicting_files: [
                {
                  file_path:
                    draft.proposed_slices?.[0]?.file_path ??
                    draft.proposedSlices?.[0]?.filePath ??
                    "src/checkout/request.ts",
                  conflict_kind: "lines-changed",
                  source_unchanged: false,
                },
              ],
              observed_revision: "rev:fixture-observed",
              expected_revision: expectedRevision,
            },
            request_id: "request:fixture-conflict",
          };
        }

        return {
          ok: false,
          error: "Fixture writeback error",
          error_kind: "internal",
          request_id: "request:fixture-error",
        };
      }

      const writebackResponse = params.get("writebackResponse");
      if (["success", "conflict", "error"].includes(writebackResponse)) {
        const realFetch = window.fetch.bind(window);
        window.fetch = (input, init = {}) => {
          const rawUrl =
            typeof input === "string"
              ? input
              : input instanceof Request
                ? input.url
                : String(input);
          const url = new URL(rawUrl, window.location.href);

          if (url.pathname === "/api/writeback") {
            const requestBody = parseWritebackBody(init);
            window.__behaviourCardWritebackRequests.push(clone(requestBody));
            const status = writebackResponse === "error" ? 500 : 200;
            return Promise.resolve(
              new Response(JSON.stringify(writebackResponseBody(writebackResponse, requestBody)), {
                status,
                headers: { "content-type": "application/json" },
              }),
            );
          }

          return realFetch(input, init);
        };
      }

      const props = {
        behaviour,
        headerLabel: "Checkout lifecycle",
        parentRevision,
        get mode() {
          return mode();
        },
        getSliceText: boolParam("withGetSliceText", false) ? getSliceText : undefined,
        onCardClick: () => {
          window.__behaviourCardEvents.push({ type: "card" });
        },
        onChevronClick: () => {
          window.__behaviourCardEvents.push({ type: "chevron" });
        },
        onSliceClick: (slice) => {
          window.__behaviourCardEvents.push({
            type: "slice",
            slice: JSON.parse(JSON.stringify(slice)),
          });
        },
        onToggleMode: (next) => {
          window.__behaviourCardEvents.push({ type: "toggle", next });
          setMode(next);
        },
        onPromoteToTest: boolParam("withPromoteCallback", false)
          ? (promotedBehaviour) => {
              window.__behaviourCardEvents.push({
                type: "promote",
                behaviour: clone(promotedBehaviour),
              });
            }
          : undefined,
        onSaved: (plan) => {
          window.__behaviourCardEvents.push({ type: "saved", plan: clone(plan) });
          setMode("view");
        },
        onConflict: (conflict) => {
          window.__behaviourCardEvents.push({ type: "conflict", conflict: clone(conflict) });
        },
        onError: (error) => {
          window.__behaviourCardEvents.push({ type: "error", error: clone(error) });
        },
      };

      render(() => BehaviourCard(props), document.getElementById("mount"));
    </script>
  </body>
</html>
