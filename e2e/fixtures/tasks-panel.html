<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TasksPanel fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0d1117;
        color: #e6edf3;
      }

      main {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 24px;
      }

      #mount {
        width: min(720px, 100%);
      }
    </style>
  </head>
  <body>
    <main>
      <div id="mount"></div>
    </main>

    <script type="module">
      import { render } from "solid-js/web";
      import { TasksPanel } from "/app/components/tasks-panel/TasksPanel.tsx";
      import { makeTask, taskStateFromString } from "/app/lib/task.ts";

      const params = new URLSearchParams(window.location.search);
      const DEFAULT_STATE_PATTERN = ["pending", "running", "paused"];

      window.__tasksPanelOpenEvents = [];
      window.__tasksPanelTransitionEvents = [];
      window.__resetTasksPanelEvents = () => {
        window.__tasksPanelOpenEvents.length = 0;
        window.__tasksPanelTransitionEvents.length = 0;
      };

      function numberParam(name, fallback) {
        const value = params.get(name);
        if (value === null || value.trim() === "") {
          return fallback;
        }

        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : fallback;
      }

      function statePatternParam() {
        const value = params.get("statePattern");
        if (value === null || value.trim() === "") {
          return DEFAULT_STATE_PATTERN;
        }

        return value
          .split(",")
          .map((state) => state.trim())
          .filter(Boolean)
          .map((state) => taskStateFromString(state));
      }

      function buildTask(index, state) {
        const createdAtMs = Date.now() - (index + 1) * 120_000;
        const prUrl =
          state === "in-pr" || state === "merged"
            ? `https://example.test/org/repo/pull/${index + 1}`
            : null;

        return makeTask({
          id: `task:fixture-${index}`,
          label: `Fixture task ${index + 1}`,
          description: `Fixture task ${index + 1} description.`,
          state,
          worktree: {
            path: `/workspace/worktrees/task-fixture-${index}`,
            branch: `task/fixture-${index}`,
            baseBranch: "main",
            baseRevision: `rev-base-${index}`,
            headRevision: null,
            createdAtMs,
          },
          originActor: "you-this-session",
          agentActor: "agents:direct",
          relatedBehaviorIds: [`behavior:fixture.${index}`],
          prompt: `Handle fixture task ${index + 1}.`,
          requestId: `request:fixture-${index}`,
          stateHistory: [
            {
              fromState: null,
              toState: state,
              actor: "agents:direct",
              reason: "Fixture task dispatched.",
              timestampMs: createdAtMs,
            },
          ],
          prUrl,
          createdAtMs,
        });
      }

      const count = Math.max(0, Math.trunc(numberParam("count", 3)));
      const statePattern = statePatternParam();
      const tasks = Array.from({ length: count }, (_, index) => {
        return buildTask(index, statePattern[index % statePattern.length]);
      });

      const props = {
        tasks,
        onTransition: (taskId, toState, reason) => {
          window.__tasksPanelTransitionEvents.push({ taskId, toState, reason });
        },
        onOpenTask: (taskId) => {
          window.__tasksPanelOpenEvents.push(taskId);
        },
      };

      if (params.has("emptyMessage")) {
        props.emptyMessage = params.get("emptyMessage");
      }

      render(() => TasksPanel(props), document.getElementById("mount"));
    </script>
  </body>
</html>
