<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigestPanel fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0d1117;
        color: #e6edf3;
      }

      main {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 24px;
      }

      #mount {
        width: min(720px, 100%);
      }
    </style>
  </head>
  <body>
    <main>
      <div id="mount"></div>
    </main>

    <script type="module">
      import { createSignal } from "solid-js";
      import { render } from "solid-js/web";
      import { DigestPanel } from "/app/components/digest-panel/DigestPanel.tsx";

      window.__digestPanelClickEvents = [];
      window.__digestPanelDisposeEvents = [];
      window.__resetDigestPanelEvents = () => {
        window.__digestPanelClickEvents.length = 0;
        window.__digestPanelDisposeEvents.length = 0;
      };

      function eventFixture(overrides) {
        return {
          id: "change:fixture",
          kind: "entity-added",
          actor: "you-other-session",
          affectedEntityIds: ["entity:fixture"],
          affectedKinds: ["module"],
          tier: "stashed",
          blocking: false,
          timestampMs: Date.now(),
          contextSummary: "Fixture summary",
          detailUrl: null,
          ...overrides,
        };
      }

      const [events, setEvents] = createSignal([
        eventFixture({
          id: "change:fixture-immediate",
          kind: "entity-renamed",
          actor: "you-other-session",
          tier: "immediate",
          contextSummary: "Immediate fixture summary",
        }),
        eventFixture({
          id: "change:fixture-stashed",
          kind: "provider-sync",
          actor: "provider:github:sync",
          tier: "stashed",
          contextSummary: "Stashed fixture summary",
        }),
        eventFixture({
          id: "change:fixture-suppressed",
          kind: "ci-run-finished",
          actor: "ci",
          tier: "suppressed",
          contextSummary: "Suppressed fixture summary",
        }),
      ]);

      render(
        () =>
          DigestPanel({
            get events() {
              return events();
            },
            onEventClick: (event) => {
              window.__digestPanelClickEvents.push(event.id);
            },
            onDispose: (eventId, disposition) => {
              window.__digestPanelDisposeEvents.push({ eventId, disposition });
              if (disposition === "disposed_to_immediate") {
                setEvents((current) =>
                  current.map((event) =>
                    event.id === eventId ? { ...event, tier: "immediate" } : event,
                  ),
                );
              }
              if (disposition === "dismissed") {
                setEvents((current) => current.filter((event) => event.id !== eventId));
              }
            },
          }),
        document.getElementById("mount"),
      );
    </script>
  </body>
</html>
